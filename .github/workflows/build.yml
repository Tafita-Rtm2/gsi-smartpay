name: Build and Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Create artifact
      run: |
        mkdir -p deploy
        cp -r out deploy/
        cp -r public deploy/
        cp server.js deploy/
        cp package.json deploy/
        cp package-lock.json deploy/
        zip -r formation-build.zip deploy/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: formation-build
        path: formation-build.zip
